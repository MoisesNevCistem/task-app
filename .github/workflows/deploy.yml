name: Sync Latest Code to Windows Server

on:
  push:
    branches:
      - staging

jobs:
  update-server:
    runs-on: ubuntu-latest

    steps:
      # Paso 1: Checkout del código
      - name: Checkout code
        uses: actions/checkout@v3

      # Paso 2: Configuración de Node.js (solo si es necesario)
      - name: Set up Node.js (latest LTS)
        uses: actions/setup-node@v3
        with:
          node-version: '20'  # Usando Node.js 20

      # Paso 3: Instalar dependencias de Node.js (para asegurar que las rutas existan)
      - name: Install dependencies
        run: |
          npm install

      # Paso 4: Verificar que las rutas existan antes de intentar almacenar en caché
      - name: Check if cache paths exist
        run: |
          echo "Verificando rutas para la caché..."
          ls -l ~/.npm
          ls -l node_modules || echo "node_modules no encontrado"

      # Paso 5: Caché de dependencias de Node.js
      - name: Cache Node.js dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.npm
            node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      # Paso 6: Configuración SSH
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p 22 -H 107.178.98.246 >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      # Paso 7: Actualización del servidor Windows con el último código desde GitHub
      - name: Update Windows Server with GitHub Code
        env:
          SSH_PASSWORD: ${{ secrets.SSH_PWD_USER }}
          ACCESS_TOKEN: ${{ secrets.ACC_TOKEN }}
        run: |
          sshpass -p "$SSH_PASSWORD" ssh -T -o StrictHostKeyChecking=no -p 22 administrator@107.178.98.246 << 'EOF'
            cd C:\Cistem\dev\task-app
            git pull https://MoisesNevCistem:${ACCESS_TOKEN}@github.com/MoisesNevCistem/task-app.git staging --allow-unrelated-histories
          EOF

      # Paso 8: Mensaje final
      - name: Final message
        run: echo "Pull realizado en el servidor Windows con éxito"