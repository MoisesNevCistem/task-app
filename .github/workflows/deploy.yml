name: Sync Latest Code to Windows Server

on:
  push:
    branches:
      - staging

jobs:
  update-server:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js (latest LTS)
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Cache Node.js dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.npm
            node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      # Instalación de dependencias solo si no están en el caché
      - name: Install dependencies (only if necessary)
        run: |
          if [ ! -d "node_modules" ]; then
            echo "Instalando dependencias con npm ci..."
            npm ci  # Solo se ejecuta si no están en caché
          else
            echo "Las dependencias ya están instaladas, usando caché."
          fi

      # Consolidación de configuración SSH y actualización del servidor
      - name: Set up SSH and Update Windows Server
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p 22 -H 107.178.98.246 >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          sshpass -p "$SSH_PASSWORD" ssh -T -o StrictHostKeyChecking=no -p 22 administrator@107.178.98.246 << 'EOF'
            cd C:\Cistem\dev\task-app
            git pull https://MoisesNevCistem:${ACCESS_TOKEN}@github.com/MoisesNevCistem/task-app.git staging --allow-unrelated-histories
          EOF

      - name: Final message
        run: echo "Pull realizado en el servidor Windows con éxito"
