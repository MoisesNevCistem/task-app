# yaml-language-server: $schema=https://json.schemastore.org/github-workflow
name: Deploy to Windows

on:
  push:
    branches:
      - staging

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Cache sshpass binary
        uses: actions/cache@v3
        with:
          path: /usr/bin/sshpass
          key: ${{ runner.os }}-sshpass
          restore-keys: |
            ${{ runner.os }}-sshpass-

      - name: Install sshpass if not cached
        run: |
          if ! command -v sshpass &> /dev/null; then
            echo "sshpass not found, installing..."
            sudo apt-get install -y sshpass
          else
            echo "sshpass is already installed or restored from cache."
          fi

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          # Omitimos el `ssh-keyscan` si ya tienes la clave configurada
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy to Windows
        env:
          SSH_PASSWORD: ${{ secrets.SSH_PWD_USER }}
          ACCESS_TOKEN: ${{ secrets.ACC_TOKEN }}
        run: |
          sshpass -p "$SSH_PASSWORD" ssh -o StrictHostKeyChecking=no -p 22 administrator@107.178.98.246 << 'EOF'
            cd C:\Cistem\dev\task-app
            git fetch origin staging
            git reset --hard origin/staging
          EOF

      - name: Final message
        run: echo "Pull realizado en MV :D"
