# yaml-language-server: $schema=https://json.schemastore.org/github-workflow
name: Sync Latest Code to Windows Server  # Nombre del flujo de trabajo actualizado

on:
  push:
    branches:
      - staging

jobs:
  update-server:  # Nombre del trabajo actualizado
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Cache sshpass binary
        uses: actions/cache@v3
        with:
          path: /usr/bin/sshpass
          key: ${{ runner.os }}-sshpass
          restore-keys: |
            ${{ runner.os }}-sshpass-

      - name: Install sshpass if not cached
        run: |
          if ! command -v sshpass &> /dev/null; then
            echo "sshpass not found, installing..."
            sudo apt-get update -qq && sudo apt-get install -y sshpass
          else
            echo "sshpass is already installed or restored from cache."
          fi

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh

          # Asegurarse de que la clave SSH privada esté configurada correctamente
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          # Evitar re-creación innecesaria del archivo known_hosts
          if [ ! -f ~/.ssh/known_hosts ]; then
            touch ~/.ssh/known_hosts
          fi

          # Solo agregar la clave si no está presente
          if ! grep -q "107.178.98.246" ~/.ssh/known_hosts; then
            ssh-keyscan -p 22 -H 107.178.98.246 >> ~/.ssh/known_hosts
          fi
          chmod 644 ~/.ssh/known_hosts
        shell: /usr/bin/bash -e {0}

      - name: Update Windows Server with GitHub Code  # Nombre del paso actualizado
        env:
          SSH_PASSWORD: ${{ secrets.SSH_PWD_USER }}
          ACCESS_TOKEN: ${{ secrets.ACC_TOKEN }}
        run: |
          sshpass -p "$SSH_PASSWORD" ssh -o StrictHostKeyChecking=no -p 22 administrator@107.178.98.246 << 'EOF'
            cd C:\Cistem\dev\task-app
            git checkout -- .
            git pull https://MoisesNevCistem:${ACCESS_TOKEN}@github.com/MoisesNevCistem/task-app.git staging --allow-unrelated-histories
          EOF

      - name: Final message
        run: echo "Pull realizado en MV :D"